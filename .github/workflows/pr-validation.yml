name: PR Validation

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/**"
      - ".github/actions/**"

# One validation run per PR (queue newer commits; do not cancel mid-run).
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.0"

jobs:
  checks:
    name: Checks (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, stage, uat, prod, nausani_vm]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache Terraform plugins
        uses: ./.github/actions/terraform-plugin-cache
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../../

      - name: Terraform Validate
        run: terraform validate

      # Require mandatory tags in both cloud example tfvars files.
      - name: Check mandatory tags in examples
        run: |
          for example in terraform.tfvars.aws.example terraform.tfvars.azure.example; do
            if [ ! -f "$example" ]; then
              echo "::error::Missing $example"
              exit 1
            fi
            for key in Team Application CostCentre; do
              grep -qE "^\s*${key}\s*=" "$example" || {
                echo "::error::Missing mandatory tag '${key}' in $example"
                exit 1
              }
            done
            echo "OK $example"
          done
