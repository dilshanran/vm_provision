name: Cloud OIDC Login
description: Authenticate to AWS or Azure using GitHub Actions OIDC (no long-lived secrets)

inputs:
  cloud:
    description: Cloud provider (aws or azure)
    required: true
  aws_role_arn:
    description: AWS IAM role ARN to assume via OIDC
    required: false
  aws_region:
    description: AWS region
    required: false
    default: us-east-1
  azure_client_id:
    description: Azure AD application (client) ID
    required: false
  azure_tenant_id:
    description: Azure AD tenant ID
    required: false
  azure_subscription_id:
    description: Azure subscription ID
    required: false

runs:
  using: composite
  steps:
    - name: Configure AWS credentials (OIDC)
      if: ${{ inputs.cloud == 'aws' }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws_role_arn }}
        aws-region: ${{ inputs.aws_region }}
        role-session-name: github-actions-vm-provision

    - name: Configure Azure credentials (OIDC)
      if: ${{ inputs.cloud == 'azure' }}
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.azure_client_id }}
        tenant-id: ${{ inputs.azure_tenant_id }}
        subscription-id: ${{ inputs.azure_subscription_id }}

    # Both providers are always declared. Newer AWS provider versions still
    # need credentials to configure, so stub unused AWS auth on Azure-only runs.
    - name: Stub unused AWS credentials (Azure-only runs)
      if: ${{ inputs.cloud == 'azure' }}
      shell: bash
      run: |
        {
          echo "AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE"
          echo "AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
          echo "AWS_EC2_METADATA_DISABLED=true"
        } >> "$GITHUB_ENV"
